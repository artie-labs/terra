<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{head_extra}}
<style>
  :root { --ink: #111; --paper: #fff; --muted: #666; --rule: #ddd; --accent: #d9480f; }
  * { box-sizing: border-box; }
  html { background: var(--paper); color: var(--ink); }
  body { margin: 0 auto; max-width: 720px; padding: 40px 16px 64px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 40px 0 8px; }
  p { margin: 0 0 12px; }
  .lede { color: var(--muted); margin-bottom: 32px; }
  .nav { font-size: 14px; color: var(--muted); margin-bottom: 40px; }
  ul.index { list-style: none; padding: 0; margin: 0; }
  ul.index li { padding: 10px 0; border-top: 1px solid var(--rule); }
  ul.index li:last-child { border-bottom: 1px solid var(--rule); }
  ul.index li span { color: var(--muted); }
  dl { display: grid; grid-template-columns: 11em 1fr; gap: 4px 16px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  pre { background: #f6f6f6; border: 1px solid var(--rule); padding: 12px; overflow-x: auto; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0 0 8px; }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; vertical-align: top; padding: 6px 8px 6px 0; border-top: 1px solid var(--rule); }
  th { color: var(--muted); font-weight: normal; }
  td.n { width: 2em; color: var(--muted); }
  img.schema { width: 100%; height: auto; border: 1px solid var(--rule); }
  .player { margin: 0 0 8px; }
  .cta { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--muted); }
  @media (max-width: 520px) { dl { grid-template-columns: 1fr; } dt { margin-top: 8px; } }
</style>
</head>
<body>
{{body}}
<p class="cta">{{cta}}</p>
</body>
</html>
