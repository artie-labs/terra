# Fixed project name: `docker compose up` from this directory, with or without
# `-p terra`, always uses the same containers and volumes.
name: terra

services:
  postgres:
    image: postgres:16
    container_name: terra-postgres
    restart: unless-stopped
    environment:
      # Admin/superuser password. Used only for you to administer the DB.
      # This is NOT the account Artie uses (that's the 'artie' role created by init/03_artie.sh).
      POSTGRES_PASSWORD: ${TERRA_ADMIN_PASSWORD:-change-me-admin-password}
      POSTGRES_DB: terra
      TERRA_ARTIE_PASSWORD: ${TERRA_ARTIE_PASSWORD:-change-me-to-a-long-random-string}
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"          # required for CDC; the #1 thing people forget
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "idle_in_transaction_session_timeout=86400000"  # 24h; Artie's docs suggest setting this
    ports:
      - "5432:5432"                  # host:container; Artie connects to the host's 5432
    volumes:
      # Scripts here run ONCE, in filename order, the first time the volume is empty:
      #   01_schema.sql  -> tables + enum
      #   02_seed.sql    -> generated data (create it with generate_seed.py, see README)
      #   03_artie.sh    -> artie role (password from TERRA_ARTIE_PASSWORD), grants, publication
      # 03_artie.sh reads TERRA_ARTIE_PASSWORD, the same variable the subscriber uses.
      - ./init:/docker-entrypoint-initdb.d:ro
      - terra_pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP on purpose: the init-phase server only listens on a unix socket, so
      # this stays unhealthy until the seed has finished loading. The window is
      # 30 minutes so the 1m and 5m seed presets can finish loading.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d terra"]
      interval: 2s
      timeout: 3s
      retries: 900

  # A stand-in for the replication consumer: a second Postgres that subscribes to
  # dbz_publication with native logical replication. It lets the whole demo run
  # with no account anywhere. It is NOT a CDC pipeline: DDL is not replicated, so
  # events/subscriber/ carries the matching DDL for it. See pg/README.md.
  subscriber:
    image: postgres:16
    container_name: terra-subscriber
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${TERRA_ADMIN_PASSWORD:-change-me-admin-password}
      POSTGRES_DB: terra
      # The artie role is created by init/03_artie.sh from this same variable,
      # so there is one place to set it.
      TERRA_ARTIE_PASSWORD: ${TERRA_ARTIE_PASSWORD:-change-me-to-a-long-random-string}
    ports:
      # Localhost only: the subscriber is a local stand-in and keeps the
      # default password. Only the source is meant to be reachable from outside.
      - "127.0.0.1:5433:5432"
    volumes:
      - ./init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./subscriber/02_subscribe.sh:/docker-entrypoint-initdb.d/02_subscribe.sh:ro
      - terra_subdata:/var/lib/postgresql/data
    healthcheck:
      # Healthy only once the subscription exists AND every table has finished
      # its initial copy (state 'r'). If CREATE SUBSCRIPTION failed on first
      # start, or the copy fails because the source volume carries an older
      # schema, `docker compose up --wait` reports the service unhealthy
      # instead of leaving a replica that is up and empty.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U postgres -d terra -Atc \"SELECT count(*) > 0 AND bool_and(srsubstate = 'r') FROM pg_subscription_rel r JOIN pg_subscription s ON s.oid = r.srsubid WHERE s.subname = 'terra_sub'\" | grep -qx t"]
      interval: 2s
      timeout: 3s
      retries: 900

volumes:
  # Both volumes take the Compose project name as prefix, so `-p terra` gives
  # terra_terra_pgdata (the name earlier versions pinned explicitly) and other
  # project names, such as CI's, get their own volumes.
  terra_pgdata:
  terra_subdata:
