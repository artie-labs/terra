name: PostgreSQL dataset

on:
  pull_request:
    paths:
      - ".github/workflows/pg.yml"
      - "pg/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/pg.yml"
      - "pg/**"

permissions:
  contents: read

env:
  SOURCE_DSN: postgresql://postgres:ci-admin-password@localhost:5432/terra
  SUB_DSN: postgresql://postgres:ci-admin-password@localhost:5433/terra
  TERRA_ADMIN_PASSWORD: ci-admin-password

jobs:
  pg-fixture:
    name: Seed, subscribe, stream, eight events, verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify the checked-in seed is reproducible
        run: |
          python3 pg/generate_seed.py --animals 150 --observations-per-animal 10 -o /tmp/02_seed.sql
          cmp /tmp/02_seed.sql pg/init/02_seed.sql

      - name: README run-time number matches pg/bench.txt
        run: python3 pg/bench_readme.py --check

      - name: Start source and subscriber from fresh volumes
        working-directory: pg
        run: |
          docker compose -p terra-ci down --volumes --remove-orphans
          docker compose -p terra-ci up --detach --wait --wait-timeout 240

      - name: Baseline verify (seed copied to the subscriber)
        working-directory: pg
        run: python3 verify.py --source "$SOURCE_DSN" --dest "$SUB_DSN" --wait 180

      - name: Stream, then apply the eight events one at a time
        working-directory: pg
        run: |
          python3 stream.py --dsn "$SOURCE_DSN" --rate 10 > /tmp/stream.log 2>&1 &
          echo $! > /tmp/stream.pid
          sleep 5
          for n in 1 2 3 4 5 6 7 8; do
            before=$(grep -c ' ops  totals ' /tmp/stream.log || true)
            events/apply.sh "$n"
            # Every step must pass: with events/subscriber/ applied, the Postgres
            # docs say the apply worker retries until the schemas fit.
            python3 verify.py --source "$SOURCE_DSN" --dest "$SUB_DSN" --wait 180
            # The writer must still be writing after the event, not stalled on it.
            sleep 3
            after=$(grep -c ' ops  totals ' /tmp/stream.log || true)
            [ "$after" -gt "$before" ] || { echo "stream.py stopped writing after event $n"; exit 1; }
          done
          kill "$(cat /tmp/stream.pid)" 2>/dev/null || echo "writer had already exited"
          sleep 2
          tail -3 /tmp/stream.log
          failures=$(grep -c 'failed' /tmp/stream.log || true)
          [ "$failures" -le 2 ] || { echo "stream.py failed $failures ticks"; exit 1; }

      - name: Final verify with the stream stopped
        working-directory: pg
        run: python3 verify.py --source "$SOURCE_DSN" --dest "$SUB_DSN" --wait 120

      - name: queries.sql runs on the source and on the subscriber
        working-directory: pg
        run: |
          psql "$SOURCE_DSN" -X -v ON_ERROR_STOP=1 -f queries.sql
          psql "$SUB_DSN"    -X -v ON_ERROR_STOP=1 -f queries.sql

      - name: Print logs after failure
        if: failure()
        working-directory: pg
        run: |
          cat /tmp/stream.log || true
          docker compose -p terra-ci logs

      - name: Remove test volumes
        if: always()
        working-directory: pg
        run: docker compose -p terra-ci down --volumes --remove-orphans

  quick-start:
    name: README path, events/apply.sh all under load
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Start source and subscriber from fresh volumes
        working-directory: pg
        run: |
          docker compose -p terra-qs down --volumes --remove-orphans
          docker compose -p terra-qs up --detach --wait --wait-timeout 240

      - name: Run the three README commands back to back, writer at 40 ops/s
        working-directory: pg
        run: |
          python3 verify.py --source "$SOURCE_DSN" --dest "$SUB_DSN" --wait 180
          python3 stream.py --dsn "$SOURCE_DSN" --rate 40 --quiet > /tmp/stream.log 2>&1 &
          echo $! > /tmp/stream.pid
          sleep 5
          events/apply.sh all
          python3 verify.py --source "$SOURCE_DSN" --dest "$SUB_DSN" --wait 180
          kill "$(cat /tmp/stream.pid)" 2>/dev/null || echo "writer had already exited"
          sleep 2
          python3 verify.py --source "$SOURCE_DSN" --dest "$SUB_DSN" --wait 120
          tail -2 /tmp/stream.log

      - name: Event files are re-runnable, and the source-only path works
        working-directory: pg
        run: |
          events/apply.sh all
          SUB_DSN=none events/apply.sh all
          python3 verify.py --source "$SOURCE_DSN" --dest "$SUB_DSN" --wait 120

      - name: Extra destination columns fail by default and pass with --allow-extra-columns
        working-directory: pg
        run: |
          psql "$SUB_DSN" -X -q -c "ALTER TABLE animals ADD COLUMN legacy_note text DEFAULT 'kept'"
          if python3 verify.py --source "$SOURCE_DSN" --dest "$SUB_DSN" --wait 5; then echo "expected FAIL"; exit 1; fi
          python3 verify.py --source "$SOURCE_DSN" --dest "$SUB_DSN" --allow-extra-columns --wait 60
          python3 verify.py --source "$SOURCE_DSN" --dest "$SUB_DSN" --allow-extra-columns --ignore-types --wait 60

      - name: Print logs after failure
        if: failure()
        working-directory: pg
        run: |
          cat /tmp/stream.log || true
          docker compose -p terra-qs logs subscriber

      - name: Remove test volumes
        if: always()
        working-directory: pg
        run: docker compose -p terra-qs down --volumes --remove-orphans
