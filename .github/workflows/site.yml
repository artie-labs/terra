name: artie.world

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/site.yml"
      - "site/**"
      - "pg/bench.txt"
  pull_request:
    paths:
      - ".github/workflows/site.yml"
      - "site/**"
      - "pg/bench.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build site/_site from datasets.json and pg/bench.txt
        run: python3 site/build.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/_site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job can publish; PR builds get read-only permissions.
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
